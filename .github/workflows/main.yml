name: Build BFirstX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q BFirstX-Instagram-Cleaner-PhoneDirect-v2.zip
          ls -la BFirstX-Instagram-Cleaner

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle --no-daemon -p BFirstX-Instagram-Cleaner assembleDebug

      - name: Prepare APK
        run: |
          cp BFirstX-Instagram-Cleaner/app/build/outputs/apk/debug/app-debug.apk BFirstX-Instagram-Cleaner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BFirstX-Instagram-Cleaner-APK
          path: BFirstX-Instagram-Cleaner.apk
